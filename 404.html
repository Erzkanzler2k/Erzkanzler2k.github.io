<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07080b">
  <meta name="robots" content="noindex">
  <title>404 — страница не найдена · Erzkanzler</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Unbounded:wght@500;600&display=swap">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(900px circle at 50% -10%, rgba(139,92,246,.22), transparent 60%), #07080b;
      color: #edeef4;
      font-family: "Inter", system-ui, sans-serif;
      text-align: center;
    }
    .code {
      font-family: "Unbounded", sans-serif;
      font-size: clamp(4rem, 18vw, 9rem);
      line-height: 1;
      letter-spacing: -0.05em;
      background: linear-gradient(135deg, #8b5cf6, #22d3ee);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 0;
    }
    p { color: #9096a8; max-width: 46ch; margin: 18px auto 0; line-height: 1.65; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 28px;
      padding: 13px 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, #8b5cf6, #22d3ee);
      color: #06070a;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <div>
    <p class="code">404</p>
    <p>Такой страницы нет. Возможно, ссылка устарела или в адресе опечатка.</p>
    <a href="/">На главную <span aria-hidden="true">→</span></a>
  </div>
</body>
</html>
